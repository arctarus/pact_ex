name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, OTP ${{ matrix.beam.otp }}, Elixir ${{ matrix.beam.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        beam:
          # The oldest supported pair.
          - { otp: "26", elixir: "1.18" }
          - { otp: "27", elixir: "1.18" }
          - { otp: "28", elixir: "1.19" }
    env:
      PACT_EX_BUILD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.beam.otp }}
          elixir-version: ${{ matrix.beam.elixir }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      # Rustler builds the NIF with cargo's default target directory,
      # native/pact_ex_nif/target. It is not under _build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/pact_ex_nif

      - run: mix deps.get

      - run: mix format --check-formatted

      - run: cargo fmt --check
        working-directory: native/pact_ex_nif

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: native/pact_ex_nif

      - run: cargo test
        working-directory: native/pact_ex_nif

      # The :plugin tests and the ignored Rust test need the protobuf plugin.
      # Without it the :plugin tests are excluded and the ignored Rust test
      # cannot run, so CI would skip them without a word.
      - run: scripts/install-protobuf-plugin.sh

      # Runs the Rust test of the exactly-once plugin cleanup against the real
      # plugin. It asserts that no plugin process runs when it starts, so it
      # must come before `mix test`.
      - run: cargo test -- --ignored
        working-directory: native/pact_ex_nif

      # The test environment is the one `mix test` uses next, so the NIF is
      # not built twice.
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      # Includes the abort matrix (test/abort_matrix_test.exs, tag
      # :abort_matrix), which runs each risky input in its own OS process.
      - run: mix test

      # No plugin process may survive the suite. Cleanup and freeing can finish
      # asynchronously, so poll for up to 5 s before failing. The script is the
      # step's own file, so `pgrep -f` does not match this shell's command line.
      - name: No plugin process is left running
        if: success() || failure()
        run: |
          for _ in $(seq 50); do
            pgrep -f pact-protobuf-plugin > /dev/null || exit 0
            sleep 0.1
          done
          exit 1

  lint:
    name: Credo and Dialyzer
    runs-on: ubuntu-latest
    env:
      PACT_EX_BUILD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      # Dialyzer needs the compiled project, and that builds the NIF.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/pact_ex_nif

      - run: mix deps.get

      # Strict mode and the enabled checks are set in .credo.exs.
      - run: mix credo

      # Building the PLTs from scratch takes minutes. The key changes with the
      # OTP and Elixir versions and with mix.lock; an older PLT is restored and
      # updated when only mix.lock changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      # The test environment, as `mix precommit` uses, so test/support is
      # checked too.
      - run: mix dialyzer --format github
        env:
          MIX_ENV: test
