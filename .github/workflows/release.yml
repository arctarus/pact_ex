name: Release precompiled NIFs

# A push of a `v*` tag builds the NIFs and publishes them on the GitHub
# release. Every other trigger is a dry run: it builds the same files and
# keeps them as workflow artifacts, but checks no tag and publishes nothing.
#
#   * pull_request: only when the PR touches native code, the NIF loader
#     (`lib/pact_ex/native.ex`), `mix.exs` or the release pipeline;
#   * workflow_dispatch: a manual dry run, from the Actions tab.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/release.yml"
      - "mix.exs"
      - "lib/pact_ex/native.ex"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or pull request cancels the dry run still going for
# it. A tag push is never cancelled: a release must run to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16", "2.17"]
        job:
          - { target: aarch64-apple-darwin, os: macos-14 }
          # macos-13 is retired. macos-15-intel is its replacement for x86_64.
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, use-cross: true }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # A tag push (the only `push` trigger) must match @version. A dry run has
      # no tag and uses @version for the file names.
      - name: Read the version
        shell: bash
        run: |
          mix_version=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)
          if [ -z "$mix_version" ]; then
            echo "::error::Could not read @version from mix.exs"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$mix_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match @version $mix_version in mix.exs"
              exit 1
            fi
          else
            echo "Dry run: using @version $mix_version from mix.exs"
          fi
          echo "PROJECT_VERSION=$mix_version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build the NIF
        id: build
        uses: philss/rustler-precompiled-action@67ed0cc2d6a423e4c4cd9ad651dcc6c90f802cdb # v1.1.5
        with:
          project-name: pact_ex_nif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: native/pact_ex_nif

      # The tarball must hold only the pact_ex_nif library. pact_ffi's own
      # cdylib must not ship in it.
      - name: Check the tarball contents
        shell: bash
        run: |
          entries=$(tar -tzf "${{ steps.build.outputs.file-path }}")
          echo "$entries"
          if [ "$(echo "$entries" | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::Expected a single file in the tarball"
            exit 1
          fi
          case "$entries" in
            "libpact_ex_nif-v${PROJECT_VERSION}-nif-${{ matrix.nif }}-${{ matrix.job.target }}.so") ;;
            *)
              echo "::error::Unexpected tarball entry: $entries"
              exit 1
              ;;
          esac

      # The glibc floor of the Linux NIFs. A symbol that needs a newer glibc
      # than the runner has would fail to load on older systems.
      # x86_64 is built natively on the runner (glibc 2.35), so it fails above
      # that. aarch64 is built in a cross image, so it only reports. `readelf`
      # reads both architectures, where the x86_64 `objdump` cannot read aarch64.
      - name: Check the glibc floor
        if: contains(matrix.job.target, 'linux-gnu')
        shell: bash
        env:
          TARBALL: ${{ steps.build.outputs.file-path }}
          TARGET: ${{ matrix.job.target }}
          LIMIT: GLIBC_2.35
        run: |
          dir=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$dir"
          so=$(echo "$dir"/*.so)
          # readelf runs on its own, so a failure of it fails the step. Only
          # grep finding no GLIBC symbol at all is accepted.
          syms=$(readelf -W --dyn-syms "$so")
          max=$({ printf '%s\n' "$syms" | grep -o 'GLIBC_[0-9.]*' || true; } | sort -Vu | tail -n1)
          echo "Maximum required glibc symbol version for $TARGET: ${max:-none}"
          echo "$TARGET (NIF ${{ matrix.nif }}): ${max:-none}" >> "$GITHUB_STEP_SUMMARY"
          case "$TARGET" in
            x86_64-*)
              top=$(printf '%s\n' "${max:-GLIBC_0}" "$LIMIT" | sort -V | tail -n1)
              if [ "$top" != "$LIMIT" ]; then
                echo "::error::$TARGET needs $max, newer than $LIMIT"
                exit 1
              fi
              ;;
          esac

      # Dry runs keep the files here. A tag push also uploads them, so that the
      # publish job can release them all together.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}
          retention-days: 7
          if-no-files-found: error

  # Only a `v*` tag push publishes, and only when every build job passed.
  # This is the only job with write access.
  publish:
    name: Publish the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List the files to publish
        shell: bash
        run: |
          ls -l dist
          if [ "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" != "12" ]; then
            echo "::error::Expected 12 tarballs (6 targets, 2 NIF versions)"
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
