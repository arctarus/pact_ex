[package]
name = "pact_ex_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "pact_ex_nif"
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
rustler = "0.38"
pact_ffi = "=0.5.12"
pact_models = "=1.3.17"

# rustler-precompiled-action picks the NIF version through these features.
[features]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]

[profile.release]
strip = true
lto = "thin"
